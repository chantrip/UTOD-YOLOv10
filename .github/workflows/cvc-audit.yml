name: CVC audit data-free checks

on:
  push:
    branches: [cvc-audit]
    paths:
      - 'audit/**'
      - 'ultralytics/utils/loss.py'
      - 'ultralytics/utils/metrics.py'
      - 'ultralytics/cfg/default.yaml'
      - 'ultralytics/cfg/models/v10/**'
      - 'vali.py'
      - '.github/workflows/cvc-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only testing prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run data-free audit tests
        run: python -m pytest -q audit/tests
